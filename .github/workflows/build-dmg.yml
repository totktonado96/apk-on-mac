name: Build DMG

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
          sdk=$(xcrun --show-sdk-version)
          echo "SDK version: $sdk"
          if [ "$(printf '26.4\n%s\n' "$sdk" | sort -V | head -1)" != "26.4" ]; then
            echo "::error::macOS SDK $sdk < 26.4 on this runner"; exit 1
          fi

      - name: Install Homebrew dependencies
        run: |
          brew update >/dev/null || true
          brew install cmake openjdk@21 capstone apktool libpng libvpx librsvg glib gettext

      - name: Cache framework-res
        uses: actions/cache@v4
        with:
          path: thirdparty/framework-res
          key: framework-res-${{ hashFiles('scripts/build_framework_res.sh') }}

      - name: Build framework-res (API 36)
        run: |
          if [ ! -s thirdparty/framework-res/framework-res-api36.apk ]; then
            scripts/build_framework_res.sh --api 36 --tag android-16.0.0_r2 --version-name 16
          fi
          ls -l thirdparty/framework-res

      - name: Build runtime
        run: runtime/scripts/build.sh

      - name: Brand (icon)
        run: scripts/brand_apk_on_mac.sh

      - name: Build launcher
        run: scripts/build_launcher.sh

      - name: Build ad-hoc signed DMG
        run: scripts/build_dist.sh --dmg

      - name: List Quick Look extensions
        run: |
          find build -name '*.appex' -maxdepth 6 -print
          for x in $(find build/dist -name '*.appex' -maxdepth 6 | tr ' ' '?'); do :; done
          find build -path '*PlugIns/*.appex' -maxdepth 6 | grep -q . 

      - name: Collect LGPL source (GLib, libintl)
        run: scripts/collect_lgpl_sources.sh build/lgpl_src

      - name: Name DMG
        run: |
          ref="${GITHUB_REF_NAME//\//-}"
          mv build/dist/Apk-on-Mac.dmg "build/dist/Apk-on-Mac-${ref}.dmg"
          ls -lh build/dist/*.dmg build/lgpl_src

      - uses: actions/upload-artifact@v4
        with:
          name: Apk-on-Mac-dmg
          path: |
            build/dist/Apk-on-Mac-*.dmg
            build/lgpl_src/*
          if-no-files-found: error

      - name: Publish pre-release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          sha=$(git rev-parse HEAD)
          cat > notes.md <<EOF
          **Alpha release of Apk on Mac** - runs Android APKs natively on Apple Silicon macOS.

          - Source: https://github.com/${GITHUB_REPOSITORY}/tree/${tag} (commit ${sha}). License: AGPL-3.0 (see LICENSE).
          - **Requirements:** macOS 26.4 or newer, Apple Silicon.
          - **Ad-hoc signed, not notarized.** First open: right-click the app, choose Open, or run
            \`xattr -dr com.apple.quarantine "/Applications/Apk on Mac.app"\`.
          - **Only install APKs you trust.** Apps run with your user permissions, unsandboxed.
          - Based on [Mac.apk](https://github.com/kksimp/Mac.apk); not affiliated with or endorsed by it.
          - Third-party licenses: THIRD_PARTY_NOTICES.txt in the DMG. Corresponding LGPL-2.1 source for the bundled GLib and libintl (exact versions, checksums, build recipes) is attached to this release (see LGPL-SOURCE-README.txt).
          EOF
          sed -i '' 's/^          //' notes.md
          gh release create "$tag" --prerelease --title "Apk on Mac $tag" --notes-file notes.md \
            build/dist/Apk-on-Mac-*.dmg build/lgpl_src/*

      - name: Update Homebrew cask (only if TAP_GITHUB_TOKEN is set)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "TAP_GITHUB_TOKEN not set; skipping cask update."
            exit 0
          fi
          ver="${GITHUB_REF_NAME#v}"
          dmg=$(ls build/dist/Apk-on-Mac-*.dmg | head -1)
          sha=$(shasum -a 256 "$dmg" | awk '{print $1}')
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/totktonado96/homebrew-tap.git" tap
          cd tap
          sed -i '' -E "s/^  version \".*\"/  version \"${ver}\"/; s/^  sha256 \".*\"/  sha256 \"${sha}\"/" Casks/apk-on-mac.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "apk-on-mac ${ver}" || { echo "cask already current"; exit 0; }
          git push origin HEAD:main
