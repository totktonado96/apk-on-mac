name: Port upstream

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Port new upstream commits
        id: port
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "apk-on-mac-bot"
          git config user.email "noreply@users.noreply.github.com"
          out=$(scripts/port_upstream.sh | tail -1)
          echo "$out"
          branch="upstream-port/$(date -u +%Y-%m-%d-%H%M)"
          if [ "$(git rev-list --count origin/main..HEAD)" = "0" ] && git diff --quiet origin/main -- .upstream-sync; then
            echo "Nothing new upstream."; exit 0
          fi
          git add .upstream-sync port_body.md 2>/dev/null || true
          git reset -q port_body.md 2>/dev/null || true
          git commit -m "Update .upstream-sync" .upstream-sync || true
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch" \
            --title "Port upstream commits ($out)" --body-file port_body.md
