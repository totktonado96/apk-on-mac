name: Port upstream

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Port new upstream commits
        id: port
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "apk-on-mac-bot"
          git config user.email "noreply@users.noreply.github.com"
          export PORT_BODY="$RUNNER_TEMP/port_body.md"
          out=$(scripts/port_upstream.sh | tail -1)
          echo "$out"
          branch="upstream-port/$(date -u +%Y-%m-%d-%H%M)"
          if [ "$(git rev-list --count origin/main..HEAD)" = "0" ] && git diff --quiet origin/main -- .upstream-sync; then
            echo "Nothing new upstream."; exit 0
          fi
          git commit -m "Update .upstream-sync" .upstream-sync || true
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch" \
            --title "Port upstream commits ($out)" --body-file "$PORT_BODY" || {
            echo "::warning::Could not open a PR (enable Settings > Actions > Allow GitHub Actions to create pull requests). Branch pushed: $branch"
            echo "https://github.com/${GITHUB_REPOSITORY}/compare/main...${branch//\//%2F}?expand=1"; }
