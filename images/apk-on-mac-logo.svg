<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <title>Apk on Mac</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5dfc"/>
      <stop offset="1" stop-color="#2a1b7a"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e7f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#120a40" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- app tile -->
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>

  <!-- macOS window -->
  <g filter="url(#shadow)">
    <rect x="76" y="104" width="360" height="304" rx="30" fill="url(#win)"/>
  </g>
  <rect x="76" y="104" width="360" height="56" rx="30" fill="#f4f2fc"/>
  <rect x="76" y="140" width="360" height="20" fill="#f4f2fc"/>
  <line x1="76" y1="160" x2="436" y2="160" stroke="#dcd8f0" stroke-width="2"/>
  <circle cx="112" cy="132" r="10" fill="#ff5f57"/>
  <circle cx="144" cy="132" r="10" fill="#febc2e"/>
  <circle cx="176" cy="132" r="10" fill="#28c840"/>

  <!-- isometric package (the .apk) -->
  <g transform="translate(256 284)">
    <polygon points="0,-92 84,-46 0,0 -84,-46" fill="#7af0ae"/>
    <polygon points="-84,-46 0,0 0,96 -84,50" fill="#3ddc84"/>
    <polygon points="84,-46 0,0 0,96 84,50" fill="#20a862"/>
    <!-- tape across the lid -->
    <polygon points="-42,-69 42,-23 42,-5 -42,-51" fill="#ffffff" opacity="0.55"/>
    <!-- play/run chevron on the front face -->
    <polygon points="22,4 62,26 22,70" fill="#ffffff" opacity="0.9" transform="translate(-4 0)"/>
  </g>
</svg>
